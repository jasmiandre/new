name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Periksa format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Berkas berikut belum terformat:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tes
        run: go test -race ./...

      - name: Build
        run: go build ./...
